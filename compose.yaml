# bubu (Claude Code 2.1.88) running against a bundled Ollama backend.
#
# The Ollama server is baked into the image. On the FIRST run the container
# downloads the model (~13GB) and builds the 32k-context variant; that model
# is saved to the ollama-data volume, so later runs start instantly.
#
# Quick start (Podman):
#   podman compose build
#   podman compose run --rm bubu
#
# Docker works too — replace `podman` with `docker`.

services:
  bubu:
    build:
      context: .
      dockerfile: Dockerfile
    image: bubu:2.1.88

    # Interactive terminal — bubu is a TUI, so it needs a real tty + stdin.
    stdin_open: true
    tty: true

    environment:
      # Ollama runs inside this same container.
      ANTHROPIC_BASE_URL: "http://localhost:11434"
      ANTHROPIC_MODEL: "gpt-oss-agent:32k"
      ANTHROPIC_DEFAULT_OPUS_MODEL: "gpt-oss-agent:32k"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "gpt-oss-agent:32k"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "gpt-oss-agent:32k"
      ANTHROPIC_SMALL_FAST_MODEL: "gpt-oss-agent:32k"

    volumes:
      # Your current project directory becomes bubu's workspace.
      - "${PWD:-.}:/workspace"
      # Persist login/session/config state across runs.
      - bubu-config:/root/.bubu
      # Persist the downloaded model so it's only fetched once.
      - ollama-data:/root/.ollama

    working_dir: /workspace

    # --- GPU acceleration (NVIDIA / CUDA) ---
    # The image auto-uses the GPU when one is exposed, and falls back to CPU
    # otherwise. To enable GPU with compose, uncomment the block below.
    # (With plain `podman run`, add: --device nvidia.com/gpu=all)
    #
    # devices:
    #   - "nvidia.com/gpu=all"

volumes:
  bubu-config:
  ollama-data:
